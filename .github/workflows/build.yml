name: Build and Publish Overlay

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build

    - name: Build the Application
      run: cmake --build build --config Release
        
    - name: Upload as Public Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GamerOverlay-Windows
        path: |
          build/Release/Overlay.exe
          build/Overlay.exe